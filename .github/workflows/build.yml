name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev cmake ninja-build

      - name: Fetch dde-tray-loader interface headers
        run: |
          mkdir -p deps/include/dde-dock
          base=https://raw.githubusercontent.com/linuxdeepin/dde-tray-loader/master/interfaces
          for f in common.h constants.h pluginmanagerinterface.h \
                   pluginproxyinterface.h pluginsiteminterface.h pluginsiteminterface_v2.h; do
            curl -fsSL -o deps/include/dde-dock/$f $base/$f
          done

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DDDE_TRAY_LOADER_INCLUDE_OVERRIDE=$PWD/deps/include/dde-dock

      - name: Build
        run: cmake --build build
